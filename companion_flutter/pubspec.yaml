name: remindme_companion
description: A gentle task companion with Mochi the pixel cat.
publish_to: none
version: 0.3.1+4
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
  assets:
    - assets/fonts/Nunito-OFL.txt
    - assets/fonts/Lora-OFL.txt
    - assets/fonts/RobotoMono-OFL.txt
